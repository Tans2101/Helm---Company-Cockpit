          try {
            var helmTheme = localStorage.getItem("helm_appearance") || "light";
            var resolvedHelmTheme = helmTheme === "system"
              ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
              : helmTheme;
            document.documentElement.dataset.theme = resolvedHelmTheme;
            document.documentElement.style.colorScheme = resolvedHelmTheme;
