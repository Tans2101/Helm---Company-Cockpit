<!doctype html>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#F5F0E6" />
        <script>
          try {
            var helmTheme = localStorage.getItem("helm_appearance") || "light";
            var resolvedHelmTheme = helmTheme === "system"
              ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
              : helmTheme;
            document.documentElement.dataset.theme = resolvedHelmTheme;
            document.documentElement.style.colorScheme = resolvedHelmTheme;
          } catch (e) {}
        </script>
        <meta name="description" content="Helm — Run the business. Don't chase it. Built for CEOs running companies of up to 50 people — funded or not." />
