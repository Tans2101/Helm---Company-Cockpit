# Render Blueprint — Helm API
# https://render.com/docs/blueprint-spec
services:
  - type: pserv
    name: helm-mongo
    runtime: image
    plan: starter
    image:
      url: docker.io/library/mongo:7
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 10

  - type: web
    name: helm-company-cockpit
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt && python scripts/check_prod_env.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: USE_ATLAS_MONGO
        value: "true"
      - key: MONGO_URL
        sync: false
      - key: MONGO_HOST
        fromService:
          name: helm-mongo
          type: pserv
          property: host
      - key: MONGO_HOSTPORT
        fromService:
          name: helm-mongo
          type: pserv
          property: hostport
      - key: DB_NAME
        value: helm
      - key: SESSION_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.helmcontrol.online
      - key: APP_URL
        value: https://www.helmcontrol.online
      - key: CORS_ORIGINS
        value: https://www.helmcontrol.online,https://helmcontrol.online
      - key: COOKIE_DOMAIN
        value: helmcontrol.online
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "lax"
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: DEMO_RESET_ENABLED
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: CLERK_SECRET_KEY
        sync: false
        # Must be sk_live_ from the clerk.helmcontrol.online Clerk instance (same as CLERK_PUBLISHABLE_KEY).
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_live_Y2xlcmsuaGVsbWNvbnRyb2wub25saW5lJA
      - key: CLERK_JWKS_URL
        value: https://clerk.helmcontrol.online/.well-known/jwks.json
      - key: CLERK_PRIMARY_ORIGIN
        value: https://www.helmcontrol.online
      - key: CLERK_PROXY_BOOTSTRAP
        value: helm-clerk-edge-8c4f2a9e1b7d
      - key: SETUP_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_PRICE_ID
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_ENV
        value: production
      - key: PRO_PRICE
        value: "8"
      - key: BILLING_ENFORCED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
