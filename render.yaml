# Render Blueprint — Helm API
# Production database is MongoDB Atlas (MONGO_URL). Do not provision a second Mongo.
# If a leftover helm-mongo private service still exists on Render, delete it after
# confirming /api/health shows Atlas.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: helm-company-cockpit
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt && python scripts/check_prod_env.py && python -c "import storage, pagination, document_cleanup, rate_limit, weekly_pack_export, department_report_drafts, financial_export, credential_crypto"
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: USE_ATLAS_MONGO
        value: "true"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: helm
      - key: SESSION_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.helmcontrol.online
      - key: APP_URL
        value: https://www.helmcontrol.online
      - key: CORS_ORIGINS
        value: https://www.helmcontrol.online,https://helmcontrol.online
      - key: COOKIE_DOMAIN
        value: helmcontrol.online
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "lax"
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: DEMO_RESET_ENABLED
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: CLERK_SECRET_KEY
        sync: false
        # Must be sk_live_ from the clerk.helmcontrol.online Clerk instance (same as CLERK_PUBLISHABLE_KEY).
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_live_Y2xlcmsuaGVsbWNvbnRyb2wub25saW5lJA
      - key: CLERK_JWKS_URL
        value: https://clerk.helmcontrol.online/.well-known/jwks.json
      - key: CLERK_PRIMARY_ORIGIN
        value: https://www.helmcontrol.online
      - key: SETUP_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_ENV
        value: production
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
        # Fernet key for OAuth / ERP credentials at rest. Generate with:
        # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
        # Never commit the real value. After setting, run:
        # python scripts/migrate_encrypt_integration_tokens.py
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_PRICE_ID_STARTER
        sync: false
      - key: PADDLE_PRICE_ID_GROWTH
        sync: false
      - key: PADDLE_PRICE_ID_BUSINESS
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_ENV
        value: production
      - key: BILLING_ENFORCED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
        # After Resend verifies send.helmcontrol.online, set:
        # Helm <contact@helmcontrol.online>
        # Until then, Resend will reject sends from this domain.
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: ANALYTICS_ADMIN_EMAIL
        value: tansherdhawan@gmail.com

  - type: cron
    name: helm-retention-checks
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    rootDir: backend
    schedule: "0 13 * * *"
    buildCommand: pip install --upgrade pip
    startCommand: python scripts/run_retention_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: RETENTION_CRON_URL
        value: https://www.helmcontrol.online/api/internal/run-retention-checks

  - type: cron
    name: helm-accounting-sync
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    rootDir: backend
    schedule: "15 * * * *"
    buildCommand: pip install --upgrade pip
    startCommand: python scripts/run_accounting_sync_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: ACCOUNTING_SYNC_CRON_URL
        value: https://www.helmcontrol.online/api/internal/run-accounting-sync
